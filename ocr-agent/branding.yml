# Branding del cliente para la pantalla de login de ThunderID.
#
# Este fichero es la fuente declarativa del branding. El despliegue de ThunderID
# debe copiar los assets a su frontend y convertir esta seccion en gate-config.js.
# No se usan URLs remotas en el Gate en produccion: se descargan y versionan los
# assets dentro de la imagen/configuracion de ThunderID.
brand:
  product_name: Madrid Digital
  logo:
    light: assets/images/madrid-digital-logo.svg
    dark: assets/images/madrid-digital-logo.svg
    source: https://upload.wikimedia.org/wikipedia/commons/0/00/Urbaser-logotipo.png
  favicon:
    light: assets/images/madrid-digital-logo.svg
    dark: assets/images/madrid-digital-logo.svg
    source: https://upload.wikimedia.org/wikipedia/commons/0/00/Urbaser-logotipo.png

# Salida esperada en gate-config.js de ThunderID.
gate_config:
  brand:
    product_name: Madrid Digital
    favicon:
      light: assets/images/madrid-digital-logo.svg
      dark: assets/images/madrid-digital-logo.svg

# Logo exclusivo del cliente OAuth OCR Chat. El Gate global mantiene Urbaser;
# este se muestra en el bloque "Application logo" de la pantalla de login.
application:
  name: OCR Chat
  logo:
    path: branding/assets/images/madrid-digital-logo.svg
    login_asset: branding/assets/images/madrid-digital-logo.svg
    gate_url: /gate/assets/images/madrid-digital-logo.svg
